<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Search Results</title>
  </head>
  <body>
    <h1>Results</h1>
    <div>
      <h3>Query image</h3>
      <img src="{{ url_for('uploaded_file', filename=query_image[1]) }}" alt="query" style="max-width:300px;" />
    </div>
    <div>
      <h3>Top matches</h3>
      <ol>
      {% for r in results %}
        <li>
          <img src="{{ url_for('data_clean_file', filename=r.relpath) }}" style="max-width:200px;" />
          <div>{{ r.folder }}/{{ r.file_name }} — distance: {{ '%.4f'|format(r.distance) }}</div>
        </li>
      {% endfor %}
      </ol>
    </div>
    <a href="/">Back</a>
  </body>
  </html>
